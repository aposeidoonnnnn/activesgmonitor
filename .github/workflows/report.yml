name: ActiveSG Gym Crowd Report & Dashboard

# Regenerates reports/report.md and the docs/ dashboard website from the
# full accumulated data/crowd_log.csv.
#
# Runs on every push that touches data/crowd_log.csv (from the Mac's
# auto-push or a GitHub Actions scrape run), so the published site
# reflects new data within a couple of minutes instead of waiting for the
# weekly schedule. The weekly cron is kept as a fallback in case no scrape
# pushes for a while. No infinite-loop risk: this job only ever commits to
# reports/ and docs/, never to data/crowd_log.csv, so its own commits don't
# re-trigger it.

on:
  push:
    branches: [claude/activesg-gym-crowd-scraper-slihpx]
    paths: ['data/crowd_log.csv']
  schedule:
    - cron: '0 2 * * 1' # Every Monday 02:00 UTC, fallback safety net
  workflow_dispatch: {}

permissions:
  contents: write

concurrency:
  group: activesg-report
  cancel-in-progress: false

jobs:
  report:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Generate report and dashboard
        run: python generate_report.py --html --website

      - name: Commit and push results
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add reports/ docs/
          if git diff --cached --quiet; then
            echo "No changes to commit"
          else
            git commit -m "Update report and dashboard $(date -u +%Y-%m-%dT%H:%M:%SZ)"
            for i in 1 2 3 4; do
              git pull --rebase origin "${GITHUB_REF_NAME}" && git push origin "HEAD:${GITHUB_REF_NAME}" && break
              echo "Push attempt $i failed, retrying..."
              sleep $((i * 3))
            done
          fi
